[package]
name = "mega-plays"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kvark/mega-plays"
authors = ["Dzmitry Malyshau"]
description = "Live-learning game demos built on Blade and Meganeura."

[[bin]]
name = "pong"
path = "src/bin/pong.rs"

[[bin]]
name = "lander"
path = "src/bin/lander.rs"

[[bin]]
name = "catch"
path = "src/bin/catch.rs"

[dependencies]
# Blade and Meganeura must use the same blade-graphics version. Both are
# pinned by rev to avoid linking two copies of the GPU context type.
# Spell the rev *exactly* as meganeura's Cargo.toml spells it: Cargo keys
# a git source on the literal rev string, so an abbreviated SHA and its
# full form are two different sources — same commit, two crate instances,
# and `Some(gpu)` stops type-checking with "multiple different versions
# of crate blade_graphics in the dependency graph".
blade-graphics = { git = "https://github.com/kvark/blade", rev = "60c2eeb8d6180ff2db5167e304d55b78a18dfee2" }
blade-egui = { git = "https://github.com/kvark/blade", rev = "60c2eeb8d6180ff2db5167e304d55b78a18dfee2" }
blade-macros = "0.3"
egui = "0.34"
egui-winit = { version = "0.34", default-features = false }
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.10"
# Shared with meganeura (already a transitive dep); used to emit CPU
# spans that meganeura's profiler captures onto the Perfetto track.
tracing = { version = "0.1", default-features = false, features = ["std"] }

meganeura = { git = "https://github.com/kvark/meganeura", rev = "fcd34ab" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
